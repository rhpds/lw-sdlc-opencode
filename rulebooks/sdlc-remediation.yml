---
# SDLC remediation — Event-Driven Ansible rulebook (Automation Orchestrator path)
#
# EDA is the sensor/bridge only:
#   Nexus *.rhlw-*           → JT "SDLC Start Orchestrator"  → AO owns the run
#   PipelineRun terminal     → JT "SDLC Signal AO CI/CD Gate" (await_build)
#   Argo Synced+Healthy/fail → JT "SDLC Signal AO CI/CD Gate" (await_deploy)
#
# Lifecycle signals MUST NOT Start a second remediation (ADR-025 / ADR-033).
# MR Verifier runs in-loop on the AO canvas after Impact.
# For the pre-AO chain, use sdlc-remediation-legacy.yml.

- name: SDLC OpenCode remediation
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    # --- CI/CD build gate (PipelineRun terminal) ---
    # Payload contract (helper or Tekton CloudEvent adapter):
    #   type: pipelinerun_terminal
    #   guid, gitlab_path, status: Succeeded|Failed
    - name: PipelineRun terminal signals await_build
      condition: >
        event.payload.type is defined and
        event.payload.type == "pipelinerun_terminal" and
        event.payload.status is defined and
        event.payload.status is search("(?i)^(Succeeded|Failed|Cancelled|Error)$")
      action:
        run_job_template:
          name: "SDLC Signal AO CI/CD Gate"
          organization: "{{ aap_organization_name }}"
          job_args:
            extra_vars:
              gate_node_id: await_build
              decision: >-
                {{
                  'approved'
                  if (event.payload.status | default('') | lower) == 'succeeded'
                  else 'rejected'
                }}
              guid: "{{ event.payload.guid | default(guid | default('')) }}"
              gitlab_path: "{{ event.payload.gitlab_path | default('') }}"
              ao_execution_id: "{{ event.payload.ao_execution_id | default('') }}"
              signal_source: pipelinerun
              ao_base_url: "{{ ao_base_url }}"
              ao_client_id: "{{ ao_client_id }}"
              ao_client_secret: "{{ ao_client_secret }}"
              validate_certs: "{{ validate_certs | default(false) }}"

    # --- CI/CD deploy gate (Argo health) ---
    # Success: sync=Synced AND health=Healthy
    # Failure: Degraded | SyncFailed | health != Healthy (when sync terminal)
    # Progressing alone: milestone log only (next rule falls through to unmatched)
    - name: Argo Healthy signals await_deploy success
      condition: >
        event.payload.type is defined and
        event.payload.type == "argo_app_health" and
        (event.payload.sync | default('') | lower) == "synced" and
        (event.payload.health | default('') | lower) == "healthy"
      action:
        run_job_template:
          name: "SDLC Signal AO CI/CD Gate"
          organization: "{{ aap_organization_name }}"
          job_args:
            extra_vars:
              gate_node_id: await_deploy
              decision: approved
              guid: "{{ event.payload.guid | default(guid | default('')) }}"
              gitlab_path: "{{ event.payload.gitlab_path | default('') }}"
              ao_execution_id: "{{ event.payload.ao_execution_id | default('') }}"
              signal_source: argo_healthy
              ao_base_url: "{{ ao_base_url }}"
              ao_client_id: "{{ ao_client_id }}"
              ao_client_secret: "{{ ao_client_secret }}"
              validate_certs: "{{ validate_certs | default(false) }}"

    - name: Argo deploy failure signals await_deploy reject
      condition: >
        event.payload.type is defined and
        event.payload.type == "argo_app_health" and
        (
          (event.payload.health | default('') | lower) in ["degraded", "missing"] or
          (event.payload.sync | default('') | lower) in ["unknown"] or
          (event.payload.phase | default('') | lower) in ["syncfailed", "failed"]
        )
      action:
        run_job_template:
          name: "SDLC Signal AO CI/CD Gate"
          organization: "{{ aap_organization_name }}"
          job_args:
            extra_vars:
              gate_node_id: await_deploy
              decision: rejected
              guid: "{{ event.payload.guid | default(guid | default('')) }}"
              gitlab_path: "{{ event.payload.gitlab_path | default('') }}"
              ao_execution_id: "{{ event.payload.ao_execution_id | default('') }}"
              signal_source: argo_failed
              ao_base_url: "{{ ao_base_url }}"
              ao_client_id: "{{ ao_client_id }}"
              ao_client_secret: "{{ ao_client_secret }}"
              validate_certs: "{{ validate_certs | default(false) }}"

    # Only Lightwell remediated artifacts (.rhlw-NNNNN). Unfiltered CREATED also
    # matches transitive deps pulled during MR verify and re-triggers the pipeline.
    - name: Nexus component created or vulnerability fix published
      condition: >
        (event.payload.action is defined and event.payload.action == "CREATED" and
         event.payload.component.version is defined and
         event.payload.component.version is search("rhlw-")) or
        (event.payload.type is defined and event.payload.type == "vulnerability_fix_published")
      action:
        run_job_template:
          name: "SDLC Start Orchestrator"
          organization: "{{ aap_organization_name }}"
          job_args:
            extra_vars:
              # Coerce component to {} — vulnerability_fix_published has no component key
              # and strict undefined would fail before default() runs.
              artifact_name: "{{ (event.payload.component | default({})).name | default(event.payload.artifact_name | default('')) }}"
              artifact_group: "{{ (event.payload.component | default({})).group | default(event.payload.artifact_group | default('')) }}"
              artifact_version: "{{ (event.payload.component | default({})).version | default(event.payload.artifact_version | default('')) }}"
              package_purl: "{{ event.payload.package | default('') }}"
              vulnerable_version: "{{ event.payload.vulnerable_version | default('') }}"
              fix_version: "{{ event.payload.fix_version | default((event.payload.component | default({})).version | default('')) }}"
              cve_id: "{{ event.payload.cve_id | default('unknown') }}"
              severity: "{{ event.payload.severity | default('medium') }}"
              tpa_url: "{{ tpa_url }}"
              keycloak_url: "{{ keycloak_url }}"
              keycloak_tpa_realm: "{{ keycloak_tpa_realm }}"
              tpa_uploader_username: "{{ tpa_uploader_username }}"
              tpa_oauth_client_id: "{{ tpa_oauth_client_id }}"
              tpa_uploader_password: "{{ tpa_uploader_password }}"
              tpa_sbom_label: "{{ tpa_sbom_label }}"
              gitlab_url: "{{ gitlab_url }}"
              remediation_app_gitlab_path: "{{ remediation_app_gitlab_path }}"
              eda_webhook_url: "{{ eda_webhook_url }}"
              opencode_base_url: "{{ opencode_base_url }}"
              opencode_server_username: "{{ opencode_server_username | default('opencode') }}"
              opencode_server_password: "{{ opencode_server_password }}"
              # Must be listed — EDA job_args replace activation extra_vars rather than
              # merging them. Omitting snow_* left Create SNOW with empty URLs (cng2l).
              snow_url: "{{ snow_url | default('') }}"
              snow_svc_url: "{{ snow_svc_url | default('') }}"
              gitlab_token: "{{ gitlab_token | default('') }}"
              tpa_oauth_client_secret: "{{ tpa_oauth_client_secret | default('') }}"
              blast_radius_mode: "{{ blast_radius_mode | default('tpa_affected_repos') }}"
              aap_organization_name: "{{ aap_organization_name }}"
              ao_base_url: "{{ ao_base_url }}"
              ao_client_id: "{{ ao_client_id }}"
              ao_client_secret: "{{ ao_client_secret }}"
              ao_start_webhook_path: "{{ ao_start_webhook_path }}"
              guid: "{{ guid | default('') }}"

    - name: Log unmatched webhook events
      condition: true
      action:
        debug:
          msg: "Unmatched SDLC webhook event (no rule action taken): {{ event.payload | default({}) }}"
