---
# Comment (and soft-resolve) a SNOW child for an AO lifecycle webhook run.
# Resolves the child by gitlab_path / cmdb_ci when child_incident is not in
# the trigger payload (GitLab / PaC / Argo events do not carry INC numbers).
# Comment body: short headline + MR / pipeline links when available.
- name: Record SNOW lifecycle event for remediation app
  hosts: localhost
  gather_facts: false
  vars:
    snow_base: "{{ snow_svc_url | default(snow_url | default(''), true) }}"

  tasks:
    - name: Require snow base and gitlab_path
      ansible.builtin.assert:
        that:
          - (snow_base | default('') | length) > 0
          - (gitlab_path | default('') | length) > 0
        fail_msg: "snow_base and gitlab_path are required for lifecycle comments"

    - name: Use explicit child_incident when provided
      ansible.builtin.set_fact:
        _target: "{{ child_incident | default(snow_incident | default(''), true) }}"
        _parent: "{{ parent_incident | default('', true) }}"
        _path: "{{ gitlab_path }}"
        _outcome: "{{ iteration_outcome | default('unknown') }}"
        _iid: "{{ merge_request_iid | default('') }}"
        _build: "{{ build_status | default(status | default('')) }}"
        _health: "{{ deploy_health | default(health | default('')) }}"
        _sha: "{{ merge_commit_sha | default('') }}"

    # Prefer server-side filters (cmdb_ci + guid). Fall back to short_description
    # scan only if the mock is older than those query params.
    - name: Build lifecycle lookup URL
      ansible.builtin.set_fact:
        _snow_lookup_url: >-
          {{ snow_base | regex_replace('/$', '') }}/api/v1/incidents?cmdb_ci={{ gitlab_path | urlencode }}{%
            if (guid | default('') | length) > 0
          %}&guid={{ guid | urlencode }}{% endif %}&open_only=1&limit=5&sort_by=opened_at&sort_order=desc
      when: (_target | default('') | length) == 0

    - name: Look up child by cmdb_ci (and guid when known)
      ansible.builtin.uri:
        url: "{{ _snow_lookup_url | regex_replace(' ', '') }}"
        method: GET
        status_code: [200]
        validate_certs: "{{ validate_certs | default(false) }}"
      register: snow_list
      when: (_target | default('') | length) == 0

    - name: Take newest cmdb_ci match
      ansible.builtin.set_fact:
        _match: >-
          {{
            (snow_list.json.result | default(snow_list.json.incidents | default([])))
            | first
            | default({})
          }}
      when: (_target | default('') | length) == 0

    - name: Fallback — open list + short_description contains gitlab_path
      ansible.builtin.uri:
        url: "{{ snow_base | regex_replace('/$', '') }}/api/v1/incidents?open_only=1&limit=200"
        method: GET
        status_code: [200]
        validate_certs: "{{ validate_certs | default(false) }}"
      register: snow_list_fb
      when:
        - (_target | default('') | length) == 0
        - (_match | default({}) | length) == 0

    - name: Match child via short_description fallback
      ansible.builtin.set_fact:
        _match: >-
          {{
            (snow_list_fb.json.result | default(snow_list_fb.json.incidents | default([])))
            | selectattr('short_description', 'defined')
            | selectattr('short_description', 'search', gitlab_path)
            | list
            | first
            | default({})
          }}
      when:
        - (_target | default('') | length) == 0
        - (_match | default({}) | length) == 0
        - snow_list_fb is defined
        - snow_list_fb is succeeded

    - name: Apply matched incident
      ansible.builtin.set_fact:
        _target: "{{ _match.number | default('') }}"
        _parent: "{{ _match.parent_incident | default(_parent | default('')) }}"
      when:
        - (_target | default('') | length) == 0
        - (_match | default({}) | length) > 0

    - name: Soft-skip when no incident found
      ansible.builtin.debug:
        msg: >-
          No SNOW incident matched gitlab_path={{ gitlab_path }} —
          recording outcome in set_stats only (guid={{ guid | default('') }}).
      when: (_target | default('') | length) == 0

    - name: Resolve merge request URL
      ansible.builtin.set_fact:
        _mr_url: >-
          {{
            merge_request_url | default('', true)
            if (merge_request_url | default('', true) | length) > 0
            else (
              (
                (gitlab_url | default('', true) | regex_replace('/$', ''))
                + '/' + (_path | default(''))
                + '/-/merge_requests/' + (_iid | string)
              )
              if (
                (gitlab_url | default('', true) | length) > 0
                and (_path | default('') | length) > 0
                and (_iid | default('') | string | length) > 0
                and (_iid | default(0) | int) > 0
              )
              else ''
            )
          }}
        _build_url: "{{ build_url | default(pac_target_url | default('', true), true) }}"

    - name: Headline by outcome
      ansible.builtin.set_fact:
        _headline: >-
          {{
            {
              'merged': 'GitLab MR merged — ' + _path,
              'build_succeeded': 'PaC build succeeded — ' + _path,
              'build_failed': 'PaC build failed — ' + _path,
              'deployed': 'ArgoCD deploy Healthy — ' + _path,
              'deploy_failed': 'ArgoCD deploy not Healthy — ' + _path,
            }[_outcome] | default('Lifecycle update — ' + _path + ' (' + _outcome + ')')
          }}
      when: (_target | default('') | length) > 0

    - name: Build lifecycle comment
      ansible.builtin.set_fact:
        # snow-mock UI: Markdown subset + autolink (escape-first).
        snow_comment_body: |
          ## {{ _headline }}

          {% if (_iid | default('') | string | length) > 0 and (_iid | default(0) | int) > 0 -%}
          {% if (_mr_url | default('') | length) > 0 -%}
          - **MR:** [!{{ _iid }}]({{ _mr_url }})
          {% else -%}
          - **MR:** !{{ _iid }}
          {% endif -%}
          {% endif -%}
          {% if (_build | default('') | length) > 0 -%}
          - **Build:** `{{ _build }}`{% if (_sha | default('') | length) > 0 %} (`{{ _sha[:12] }}`){% endif %}
          {% endif -%}
          {% if (_build_url | default('') | length) > 0 -%}
          - **Pipeline:** [open run]({{ _build_url }})
          {% endif -%}
          {% if (_health | default('') | length) > 0 -%}
          - **Deploy health:** `{{ _health }}`
          {% endif -%}
          {% if (opencode_session_ui_url | default('', true) | length) > 0 -%}
          - **OpenCode:** [session]({{ opencode_session_ui_url }})
          {% endif -%}
          {% if (_outcome | default('')) in ['build_failed', 'deploy_failed'] -%}

          **Next:** manual verify (build/deploy failed)
          {% endif -%}

          Source: `{{ signal_source | default('eda') }}` · guid: `{{ guid | default('') }}`
      when: (_target | default('') | length) > 0

    - name: POST comment on matched incident
      ansible.builtin.uri:
        url: "{{ snow_base | regex_replace('/$', '') }}/api/v1/incidents/{{ _target }}/comments"
        method: POST
        body_format: json
        body:
          body: "{{ snow_comment_body }}"
          created_by: "{{ snow_created_by | default('Lightwell AO') }}"
          type: additional_comments
        status_code: [201]
        validate_certs: "{{ validate_certs | default(false) }}"
      when: (_target | default('') | length) > 0

    - name: Export artifacts
      ansible.builtin.set_stats:
        data:
          snow_incident: "{{ _target | default('') }}"
          child_incident: "{{ _target | default('') }}"
          parent_incident: "{{ _parent | default('') }}"
          gitlab_path: "{{ gitlab_path }}"
          iteration_outcome: "{{ _outcome }}"
          merge_request_url: "{{ _mr_url | default('') }}"
          build_url: "{{ _build_url | default('') }}"
        per_host: false

    # AO Merged+Build (ADR-039): book the child INC, then fail the JT so the
    # workflow run ends Failed when CI did not succeed.
    - name: Fail AO run on hard lifecycle outcomes
      ansible.builtin.fail:
        msg: >-
          Lifecycle outcome {{ iteration_outcome }} for {{ gitlab_path }} —
          failing the AO workflow run.
      when:
        - fail_on_bad_outcome | default(false) | bool
        - (iteration_outcome | default('')) in ['build_failed', 'deploy_failed']
