---
# Start prompt_async then wait via GET /session/status (documented API).
# Sets opencode_sync_ok / opencode_sync_status for set_stats.
# Requires: opencode_base_url, opencode_agent, opencode_skill, opencode_input

- name: Import async start
  ansible.builtin.import_tasks: opencode-prompt-async.yml

- name: Wait for OpenCode session idle via /session/status
  ansible.builtin.import_tasks: opencode-wait-idle.yml
