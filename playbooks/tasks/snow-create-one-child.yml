---
# Create one child INC for ao_app under _parent; append to ao_apps_with_children.
- name: Derive child labels
  ansible.builtin.set_fact:
    _app_path: "{{ ao_app.gitlab_path | default('unknown') }}"
    _app_slug: "{{ (ao_app.gitlab_path | default('unknown')).split('/')[-1] }}"
    _approval: "{{ ao_app.approval | default('needs_approval') }}"
    _cve: "{{ cve_id | default('unknown') }}"
    _pkg: "{{ package_purl | default(artifact_name | default('n/a')) }}"
    _vuln: "{{ vulnerable_version | default('n/a') }}"
    _fix: "{{ fix_version | default(artifact_version | default('n/a')) }}"
    _sev: "{{ severity | default('medium') }}"

- name: Build child short description
  ansible.builtin.set_fact:
    _child_short: >-
      [{{ _cve }}] {{ _app_slug }} ({{ _approval }}) — {{ _pkg }}
      {{ _vuln }} → {{ _fix }}

- name: POST child incident
  ansible.builtin.uri:
    url: "{{ snow_base | regex_replace('/$', '') }}/api/v1/incidents"
    method: POST
    body_format: json
    body:
      short_description: "{{ _child_short | truncate(160, true, '') }}"
      description: |
        ## AO remediation — {{ _app_slug }}

        Child of parent **{{ _parent }}** for Lightwell Automation Orchestrator.

        ### Application

        - **GitLab path:** `{{ _app_path }}`
        - **CMDB CI:** `{{ _app_path }}`
        - **Approval policy:** `{{ _approval }}`
        - **Remediation owner:** `{{ ao_app.remediation_owner | default('ao') }}`

        ### Advisory

        - **CVE:** `{{ _cve }}`
        - **Severity:** `{{ _sev }}`
        - **Package:** `{{ _pkg }}`
        - **Vulnerable → fix:** `{{ _vuln }}` → `{{ _fix }}`

        ### Expected flow

        1. Impact Analyzer opens remediation MR
        2. MR Verifier checks the change
        3. {% if _approval == 'auto_approve' %}AO merges automatically{% else %}Student merges in GitLab (`needs_approval`){% endif %}
        4. PaC build → Argo deploy → Activity updates on this INC

        **guid:** `{{ guid | default('') }}`
      caller_id: "{{ snow_caller_id | default('lightwell.ao@example.com') }}"
      created_by: "{{ snow_created_by | default('Lightwell AO') }}"
      opened_by: "{{ snow_created_by | default('Lightwell AO') }}"
      assignment_group: "{{ snow_assignment_group | default('Application Support') }}"
      priority: "{{ snow_priority | default('2 - High') }}"
      impact: "{{ snow_impact | default('2 - Medium') }}"
      category: Software
      subcategory: Application
      channel: Monitoring
      state: New
      parent_incident: "{{ _parent }}"
      cmdb_ci: "{{ ao_app.gitlab_path | default('') }}"
      guid: "{{ guid | default('') }}"
    status_code: [201]
    validate_certs: "{{ validate_certs | default(false) }}"
  register: snow_child_create

- name: Append app with child_incident
  ansible.builtin.set_fact:
    ao_apps_with_children: "{{ ao_apps_with_children + [ao_app | combine({'child_incident': snow_child_create.json.result.number, 'parent_incident': _parent})] }}"
