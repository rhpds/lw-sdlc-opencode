---
# Per-iteration SNOW comment after Impact/Verifier/merge/reject.
# Prefer a short human headline + actionable links (MR URL) over raw bullets.
- name: Comment ServiceNow with per-iteration outcome
  hosts: localhost
  gather_facts: false
  vars:
    snow_base: "{{ snow_svc_url | default(snow_url | default(''), true) }}"

  tasks:
    - name: Resolve child vs parent incident target
      ansible.builtin.set_fact:
        # Prefer per-app child; fall back to snow_incident (legacy single-INC).
        _target_incident: "{{ child_incident | default(snow_incident | default(''), true) }}"
        _path: "{{ gitlab_path | default('unknown') }}"
        _outcome: "{{ iteration_outcome | default('unknown') }}"
        _iid: "{{ merge_request_iid | default('') }}"

    - name: Require incident
      ansible.builtin.assert:
        that:
          - (snow_base | default('') | length) > 0
          - (_target_incident | default('') | length) > 0
        fail_msg: "snow_base and child_incident (or snow_incident) are required"

    - name: Resolve merge request URL
      ansible.builtin.set_fact:
        _mr_url: >-
          {{
            merge_request_url | default('', true)
            if (merge_request_url | default('', true) | length) > 0
            else (
              (
                (gitlab_url | default('', true) | regex_replace('/$', ''))
                + '/' + (_path | default(''))
                + '/-/merge_requests/' + (_iid | string)
              )
              if (
                (gitlab_url | default('', true) | length) > 0
                and (_path | default('') | length) > 0
                and (_iid | default('') | string | length) > 0
                and (_iid | default(0) | int) > 0
              )
              else ''
            )
          }}

    - name: Headline + plain-English blurb by outcome
      ansible.builtin.set_fact:
        _app: "{{ (_path | default('app')).split('/')[-1] }}"
        _headline: >-
          {{
            {
              'awaiting_merge': 'Remediation ready for review',
              'merged': 'Remediation merged automatically',
              'already_current': 'Already on the remediated version',
              'verifier_fail': 'Verifier rejected the change',
              'mr_opened': 'Remediation merge request opened',
              'build_failed': 'Build failed after remediation',
              'deploy_failed': 'Deploy failed after remediation',
            }[_outcome] | default('Remediation update')
          }}
        _plain: >-
          {{
            {
              'awaiting_merge': (
                'A remediation merge request for **'
                + ((_path | default('app')).split('/')[-1])
                + '** is ready. Policy is **needs_approval** — please review '
                + 'and merge in GitLab when you are satisfied; CI/CD will continue from there.'
              ),
              'merged': (
                'The remediation merge request for **'
                + ((_path | default('app')).split('/')[-1])
                + '** was **auto-merged** after the verifier passed '
                + '(policy **auto_approve**). Build and deploy updates will follow on this incident.'
              ),
              'already_current': (
                '**'
                + ((_path | default('app')).split('/')[-1])
                + '** already has the remediated dependency on its default branch. '
                + 'No merge request was opened for this app.'
              ),
              'verifier_fail': (
                'The MR verifier did **not** accept the remediation for **'
                + ((_path | default('app')).split('/')[-1])
                + '**. Review the OpenCode session / MR before retrying.'
              ),
              'mr_opened': (
                'Impact Analyzer opened a remediation merge request for **'
                + ((_path | default('app')).split('/')[-1])
                + '**. Next steps depend on the approval policy for this app.'
              ),
              'build_failed': (
                'CI failed after the remediation for **'
                + ((_path | default('app')).split('/')[-1])
                + '**. Manual verification is needed before closing this incident.'
              ),
              'deploy_failed': (
                'Deploy did not become Healthy for **'
                + ((_path | default('app')).split('/')[-1])
                + '**. Check Argo CD and the cluster before closing this incident.'
              ),
            }[_outcome] | default(
              'Update for **'
              + ((_path | default('app')).split('/')[-1])
              + '** (`'
              + _outcome
              + '`).'
            )
          }}

    - name: Resolve OpenCode UI deep link
      ansible.builtin.set_fact:
        _oc_ui: >-
          {{
            opencode_session_ui_url | default('', true)
            if (opencode_session_ui_url | default('', true) | length) > 0
            else (
              (
                (opencode_ui_url | default('', true) | regex_replace('/$', ''))
                + '/global/session/' + (opencode_session_id | string)
              )
              if (
                (opencode_ui_url | default('', true) | length) > 0
                and (opencode_session_id | default('') | length) > 0
              )
              else ''
            )
          }}
        _oc_summary: "{{ opencode_session_summary | default('', true) | trim }}"

    - name: Build iteration comment
      ansible.builtin.set_fact:
        # Plain English first; policy/links/agent summary second.
        snow_comment_body: |
          ## {{ _headline }} — {{ _app }}

          {{ _plain }}

          ### Details

          - **Application:** `{{ _path }}`
          - **Approval policy:** `{{ approval | default('n/a') }}`
          - **Verifier:** `{{ verifier_status | default('n/a') }}`
          {% if (_iid | default('') | string | length) > 0 and (_iid | default(0) | int) > 0 -%}
          {% if (_mr_url | default('') | length) > 0 -%}
          - **Merge request:** [!{{ _iid }}]({{ _mr_url }})
          {% else -%}
          - **Merge request:** !{{ _iid }}
          {% endif -%}
          {% endif -%}
          {% if (_oc_ui | default('') | length) > 0 -%}
          - **OpenCode:** [agent session]({{ _oc_ui }})
          {% elif (opencode_session_id | default('') | length) > 0 -%}
          - **OpenCode session:** `{{ opencode_session_id }}`
          {% endif -%}
          {% if (opencode_session_title | default('') | length) > 0 -%}
          - **Agent title:** {{ opencode_session_title }}
          {% endif -%}
          {% if (_oc_summary | default('') | length) > 0 -%}

          ### What the agent reported

          {{ _oc_summary }}
          {% endif -%}
          {% if (_outcome | default('')) in ['build_failed', 'deploy_failed'] -%}

          **What to do next:** investigate using the links above, then re-run or escalate.
          {% endif -%}

          ---

          Parent: `{{ parent_incident | default('n/a') }}` · guid: `{{ guid | default('') }}`

    - name: POST comment on child (or legacy) incident
      ansible.builtin.uri:
        url: "{{ snow_base | regex_replace('/$', '') }}/api/v1/incidents/{{ _target_incident }}/comments"
        method: POST
        body_format: json
        body:
          body: "{{ snow_comment_body }}"
          created_by: "{{ snow_created_by | default('Lightwell AO') }}"
          type: additional_comments
        status_code: [201]
        validate_certs: "{{ validate_certs | default(false) }}"

    - name: Export artifacts
      ansible.builtin.set_stats:
        data:
          snow_incident: "{{ _target_incident }}"
          child_incident: "{{ _target_incident }}"
          parent_incident: "{{ parent_incident | default('') }}"
          iteration_outcome: "{{ _outcome }}"
          merge_request_url: "{{ _mr_url | default('') }}"
          opencode_session_id: "{{ opencode_session_id | default('') }}"
          opencode_session_ui_url: "{{ _oc_ui | default('') }}"
        per_host: false
