---
# Query TPA for blast radius; POST tpa_results back to EDA (demo depth A).
- name: Query TPA for affected repositories
  hosts: localhost
  gather_facts: false
  vars:
    # Literal default only — self-referential Jinja (x: "{{ x | default(...) }}") recurses on AWX.
    blast_radius_mode: single_app_demo_a
    remediation_gitlab_path: "{{ remediation_app_gitlab_path | default('lightwell/lw-demo-help-app') }}"

  tasks:
    - name: Import TPA token tasks
      ansible.builtin.import_tasks: tasks/get-tpa-token.yml

    - name: Query TPA SBOM API by label
      ansible.builtin.uri:
        url: "{{ tpa_url }}/api/v2/sbom?labels.name={{ tpa_sbom_label | urlencode }}"
        method: GET
        headers:
          Authorization: "Bearer {{ tpa_access_token }}"
        validate_certs: "{{ validate_certs | default(false) }}"
        status_code: [200, 401, 404]
      register: tpa_query
      when: tpa_access_token is defined
      ignore_errors: true

    - name: Default empty SBOM items
      ansible.builtin.set_fact:
        tpa_sbom_items: []

    - name: Set TPA SBOM items from API response
      ansible.builtin.set_fact:
        tpa_sbom_items: "{{ tpa_query.json['items'] | default(tpa_query.json['results'] | default([])) }}"
      when: tpa_query is succeeded and tpa_query.status == 200

    - name: Derive artifact coordinates from Nexus or vulnerability event
      ansible.builtin.set_fact:
        resolved_artifact_id: "{{ (artifact_group ~ ':' ~ artifact_name) if (artifact_group | default('') | length > 0 and artifact_name | default('') | length > 0) else (package_purl | default(artifact_name | default(''), true)) }}"
        resolved_new_version: "{{ artifact_version | default(fix_version | default('')) }}"
        resolved_gitlab_path: "{{ remediation_gitlab_path }}"

    - name: Build package_info
      ansible.builtin.set_fact:
        package_info:
          purl: "{{ package_purl | default(resolved_artifact_id, true) }}"
          artifact_id: "{{ resolved_artifact_id }}"
          vulnerable_version: "{{ vulnerable_version | default('') }}"
          fix_version: "{{ resolved_new_version }}"
          new_version: "{{ resolved_new_version }}"
          cve_id: "{{ cve_id | default('unknown') }}"

    # Demo A: labeled SBOM present ⇒ one affected app (help-app). No SBOM ⇒ count 0.
    - name: Build blast radius — match (single app)
      ansible.builtin.set_fact:
        affected_repos:
          - repo_url: "{{ gitlab_url | regex_replace('/$', '') }}/{{ resolved_gitlab_path }}.git"
            gitlab_path: "{{ resolved_gitlab_path }}"
            sbom_id: "{{ tpa_sbom_items[0].id | default('unknown') }}"
            sbom_label: "{{ tpa_sbom_label }}"
            match_reason: "sbom_label_and_dependency_coordinate"
            app_classification: demo
            deployment_env: development
        blast_radius:
          mode: "{{ blast_radius_mode }}"
          count: 1
      when: (tpa_sbom_items | length) > 0 and (resolved_artifact_id | length) > 0

    - name: Build blast radius — no match
      ansible.builtin.set_fact:
        affected_repos: []
        blast_radius:
          mode: "{{ blast_radius_mode }}"
          count: 0
      when: (tpa_sbom_items | length) == 0 or (resolved_artifact_id | default('') | length) == 0

    - name: Emit tpa_results (debug)
      ansible.builtin.debug:
        msg:
          type: tpa_results
          query: "{{ package_purl | default(resolved_artifact_id, true) }}"
          affected_repos: "{{ affected_repos }}"
          package_info: "{{ package_info }}"
          blast_radius: "{{ blast_radius }}"

    - name: Post tpa_results back to EDA webhook
      ansible.builtin.uri:
        url: "{{ eda_webhook_url }}"
        method: POST
        body_format: json
        body:
          type: tpa_results
          query: "{{ package_purl | default(resolved_artifact_id, true) }}"
          affected_repos: "{{ affected_repos }}"
          package_info: "{{ package_info }}"
          blast_radius: "{{ blast_radius }}"
        status_code: [200, 201, 202, 204]
        validate_certs: "{{ validate_certs | default(false) }}"
      register: eda_callback
