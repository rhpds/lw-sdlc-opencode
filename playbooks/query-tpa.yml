---
# Query TPA for blast radius; POST tpa_results back to EDA (demo depth A).
- name: Query TPA for affected repositories
  hosts: localhost
  gather_facts: false
  vars:
    # Literal default only — self-referential Jinja (x: "{{ x | default(...) }}") recurses on AWX.
    blast_radius_mode: single_app_demo_a
    remediation_gitlab_path: "{{ remediation_app_gitlab_path | default('lightwell/lw-demo-help-app') }}"

  tasks:
    - name: Import TPA token tasks
      ansible.builtin.import_tasks: tasks/get-tpa-token.yml

    - name: Query TPA SBOM API by label
      ansible.builtin.uri:
        url: "{{ tpa_url }}/api/v2/sbom?labels.name={{ tpa_sbom_label | urlencode }}"
        method: GET
        headers:
          Authorization: "Bearer {{ tpa_access_token }}"
        validate_certs: "{{ validate_certs | default(false) }}"
        status_code: [200, 401, 404]
      register: tpa_query
      when: tpa_access_token is defined
      ignore_errors: true

    - name: Default empty SBOM items
      ansible.builtin.set_fact:
        tpa_sbom_items: []

    - name: Set TPA SBOM items from API response
      ansible.builtin.set_fact:
        tpa_sbom_items: "{{ tpa_query.json['items'] | default(tpa_query.json['results'] | default([])) }}"
      when: tpa_query is succeeded and tpa_query.status == 200

    - name: Derive artifact coordinates from Nexus or vulnerability event
      ansible.builtin.set_fact:
        resolved_artifact_id: "{{ (artifact_group ~ ':' ~ artifact_name) if (artifact_group | default('') | length > 0 and artifact_name | default('') | length > 0) else (package_purl | default(artifact_name | default(''), true)) }}"
        resolved_new_version: "{{ artifact_version | default(fix_version | default('')) }}"
        resolved_gitlab_path: "{{ remediation_gitlab_path }}"

    # A plain Nexus component event carries no CVE, so cve_id arrives as
    # "unknown" and the MR body would have nothing to show. publish-remediation.sh
    # uploads an OSV advisory per CVE with aliases/severity/details, so look the
    # advisory up by coordinate and use it to fill the MR Summary. Best effort:
    # the bump must still happen when TPA has no advisory for this package.
    - name: Query TPA vulnerabilities for this artifact
      ansible.builtin.uri:
        # Query by artifact name: TPA indexes CVEs against the artifact, so the
        # full group:artifact coordinate matches nothing.
        url: "{{ tpa_url }}/api/v3/vulnerability?q={{ (resolved_artifact_id.split(':') | last) | urlencode }}&limit=20"
        method: GET
        headers:
          Authorization: "Bearer {{ tpa_access_token }}"
        validate_certs: "{{ validate_certs | default(false) }}"
        status_code: [200, 401, 404]
      register: tpa_vuln_query
      when: tpa_access_token is defined
      ignore_errors: true

    - name: Default advisory facts
      ansible.builtin.set_fact:
        tpa_vuln_items: []
        resolved_cve_id: "{{ cve_id | default('unknown') }}"
        resolved_cve_title: ""
        resolved_cve_description: ""
        resolved_cvss_score: ""

    - name: Set vulnerability items from API response
      ansible.builtin.set_fact:
        tpa_vuln_items: "{{ tpa_vuln_query.json['items'] | default([]) }}"
      when: tpa_vuln_query is succeeded and (tpa_vuln_query.status | default(0)) == 200

    # Prefer a CVE the caller already named; otherwise take the first CVE TPA
    # knows about for this coordinate.
    - name: Select the advisory to describe
      vars:
        _cves: "{{ tpa_vuln_items | selectattr('identifier', 'defined') | selectattr('identifier', 'match', '^CVE-') | list }}"
        _named: "{{ tpa_vuln_items | selectattr('identifier', 'defined') | selectattr('identifier', 'equalto', cve_id | default('')) | list }}"
        _pick: "{{ (_named | first) if (_named | length > 0) else ((_cves | first) if (_cves | length > 0) else {}) }}"
      ansible.builtin.set_fact:
        resolved_cve_id: "{{ _pick.identifier | default(cve_id | default('unknown'), true) }}"
        resolved_cve_title: "{{ _pick.title | default('') }}"
        resolved_cve_description: "{{ _pick.description | default('') }}"
        # base_score is the field TPA actually returns; render it with the
        # usual qualitative band so the MR reads like a CVSS score.
        resolved_cvss_score: >-
          {{ ('%.1f (%s)' % (
               _pick.base_score | float,
               'Critical' if (_pick.base_score | float) >= 9.0
               else 'High' if (_pick.base_score | float) >= 7.0
               else 'Medium' if (_pick.base_score | float) >= 4.0
               else 'Low'))
             if (_pick.base_score is defined and _pick.base_score is not none
                 and (_pick.base_score | float) > 0)
             else (severity | default('') | title) }}
      when: tpa_vuln_items | length > 0

    - name: Build package_info
      ansible.builtin.set_fact:
        package_info:
          purl: "{{ package_purl | default(resolved_artifact_id, true) }}"
          artifact_id: "{{ resolved_artifact_id }}"
          vulnerable_version: "{{ vulnerable_version | default('') }}"
          fix_version: "{{ resolved_new_version }}"
          new_version: "{{ resolved_new_version }}"
          cve_id: "{{ resolved_cve_id }}"
          cve_title: "{{ resolved_cve_title }}"
          cve_description: "{{ resolved_cve_description }}"
          cvss_score: "{{ resolved_cvss_score }}"

    # Demo A: labeled SBOM present ⇒ one affected app (help-app). No SBOM ⇒ count 0.
    - name: Build blast radius — match (single app)
      ansible.builtin.set_fact:
        affected_repos:
          - repo_url: "{{ gitlab_url | regex_replace('/$', '') }}/{{ resolved_gitlab_path }}.git"
            gitlab_path: "{{ resolved_gitlab_path }}"
            sbom_id: "{{ tpa_sbom_items[0].id | default('unknown') }}"
            sbom_label: "{{ tpa_sbom_label }}"
            match_reason: "sbom_label_and_dependency_coordinate"
            app_classification: demo
            deployment_env: development
        blast_radius:
          mode: "{{ blast_radius_mode }}"
          count: 1
      when: (tpa_sbom_items | length) > 0 and (resolved_artifact_id | length) > 0

    - name: Build blast radius — no match
      ansible.builtin.set_fact:
        affected_repos: []
        blast_radius:
          mode: "{{ blast_radius_mode }}"
          count: 0
      when: (tpa_sbom_items | length) == 0 or (resolved_artifact_id | default('') | length) == 0

    - name: Emit tpa_results (debug)
      ansible.builtin.debug:
        msg:
          type: tpa_results
          query: "{{ package_purl | default(resolved_artifact_id, true) }}"
          affected_repos: "{{ affected_repos }}"
          package_info: "{{ package_info }}"
          blast_radius: "{{ blast_radius }}"

    - name: Post tpa_results back to EDA webhook
      ansible.builtin.uri:
        url: "{{ eda_webhook_url }}"
        method: POST
        body_format: json
        body:
          type: tpa_results
          query: "{{ package_purl | default(resolved_artifact_id, true) }}"
          affected_repos: "{{ affected_repos }}"
          package_info: "{{ package_info }}"
          blast_radius: "{{ blast_radius }}"
        status_code: [200, 201, 202, 204]
        validate_certs: "{{ validate_certs | default(false) }}"
      register: eda_callback
      when: (eda_webhook_url | default('') | length) > 0

    # Automation Orchestrator reads these via aap_job_template node artifacts.
    - name: Export blast-radius artifacts for Automation Orchestrator
      ansible.builtin.set_stats:
        data:
          package_info: "{{ package_info }}"
          affected_repos: "{{ affected_repos }}"
          blast_radius: "{{ blast_radius }}"
          query: "{{ package_purl | default(resolved_artifact_id, true) }}"
        per_host: false

    # multi_app_policy_demo: classify expands to the three Acme apps even when
    # TPA still has the Red Hat product dataset (no Acme SBOMs yet). Soft-pass.
    - name: Soft-pass empty blast radius for multi_app_policy_demo
      ansible.builtin.set_fact:
        affected_repos: "{{ affected_repos | default([]) }}"
        blast_radius:
          mode: multi_app_policy_demo
          count: 3
          note: "synthetic — classify expands to seeded Acme apps"
      when: >
        (blast_radius_mode | default('')) == 'multi_app_policy_demo'
        and (blast_radius.count | default(0) | int) < 1

    - name: Re-export artifacts after soft-pass
      ansible.builtin.set_stats:
        data:
          package_info: "{{ package_info }}"
          affected_repos: "{{ affected_repos }}"
          blast_radius: "{{ blast_radius }}"
          query: "{{ package_purl | default(resolved_artifact_id, true) }}"
        per_host: false
      when: >
        (blast_radius_mode | default('')) == 'multi_app_policy_demo'
        and (blast_radius.note | default('')) | length > 0

    # AO canvas gates Impact on Query TPA job success. Legacy EDA already received
    # the tpa_results callback above when eda_webhook_url is set.
    - name: Fail when blast radius is empty (AO does not launch Impact)
      ansible.builtin.fail:
        msg: >-
          No blast radius for {{ resolved_artifact_id | default('unknown') }}
          (SBOM label {{ tpa_sbom_label | default('') }}). Skipping remediation.
      when: (blast_radius.count | default(0) | int) < 1

