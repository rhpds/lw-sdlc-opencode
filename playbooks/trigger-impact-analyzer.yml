---
- name: Trigger OpenCode impact-analyzer (draft MR) and wait for GitLab MR
  hosts: localhost
  gather_facts: false
  vars:
    opencode_agent: impact-analyzer
    opencode_skill: dependency-impact-remediation

  tasks:
    - name: Normalize blast radius / single-app iteration input
      ansible.builtin.set_fact:
        blast_count: "{{ (blast_radius.count | default(affected_repos | default([]) | length)) | int }}"
        _iter_repos: >-
          {{
            affected_repos
            if (affected_repos | default([]) | length) > 0
            else (
              [app_item]
              if (app_item is defined and app_item)
              else []
            )
          }}
        # Defaults so set_stats always has non-empty / typed values (ADR-063).
        iteration_outcome: skipped_no_target
        remediation_needed: false
        draft_mr: false
        merge_request_iid: 0
        project_id: 0
        source_branch: ""
        target_branch: "{{ gitlab_default_branch | default('main') }}"
        merge_request_url: ""
        repository_git_url: ""
        mr_poll_found: false
        impact_already_current: false
        opencode_sync_ok: false
        impact_failed: false
        impact_fail_reason: ""

    - name: Skip OpenCode when no target app
      ansible.builtin.debug:
        msg: "Skipping impact-analyzer: no affected_repos/app_item"
      when: (_iter_repos | length) < 1

    - name: Require GitLab token for MR poll / pom check
      ansible.builtin.assert:
        that:
          - (gitlab_url | default('') | length) > 0
          - (gitlab_token | default(gitlab_pat | default('')) | length) > 0
        fail_msg: "gitlab_url and gitlab_token (or gitlab_pat) required for impact outcome detection"
      when: (_iter_repos | length) >= 1

    - name: Map package_info and target repo to skill input
      ansible.builtin.set_fact:
        opencode_gitlab_path: "{{ _iter_repos[0].gitlab_path }}"
        opencode_repo_url: >-
          {{
            _iter_repos[0].repo_url
            if (_iter_repos[0].repo_url | default('') | regex_search('\\.git$'))
            else (
              (gitlab_url | default(_iter_repos[0].repo_url | default('')) | regex_replace('/$', ''))
              ~ '/' ~ _iter_repos[0].gitlab_path ~ '.git'
            )
          }}
        app_approval: "{{ _iter_repos[0].approval | default('needs_approval') }}"
        repository_git_url: >-
          {{
            _iter_repos[0].repo_url
            if (_iter_repos[0].repo_url | default('') | regex_search('\\.git$'))
            else (
              (gitlab_url | default(_iter_repos[0].repo_url | default('')) | regex_replace('/$', ''))
              ~ '/' ~ _iter_repos[0].gitlab_path ~ '.git'
            )
          }}
      when: (_iter_repos | length) >= 1

    # Risk classification travels in .lightwell/policy.json, which classify
    # carries into affected_repos as .policy. The EDA activation's extra_vars
    # are NOT a usable channel here: AO launches this job template with its
    # own payload, so anything set only on the activation never arrives.
    - name: Resolve risk metadata for the target app
      ansible.builtin.set_fact:
        _app_policy: "{{ _iter_repos[0].policy | default({}) }}"
      when: (_iter_repos | length) >= 1

    - name: Report the risk lookup
      ansible.builtin.debug:
        msg: >-
          risk app={{ opencode_gitlab_path.split('/') | last }}
          policy={{ _app_policy | default({}) }}
      when: (_iter_repos | length) >= 1

    - name: Build OpenCode skill input (draft MR)
      ansible.builtin.set_fact:
        opencode_input:
          artifact_id: "{{ package_info.artifact_id | default(package_info.purl) }}"
          new_version: "{{ package_info.new_version | default(package_info.fix_version) }}"
          package_info: "{{ package_info }}"
          affected_repos: "{{ _iter_repos }}"
          gitlab_path: "{{ opencode_gitlab_path }}"
          repo_url: "{{ opencode_repo_url }}"
          sbom_label: "{{ _iter_repos[0].sbom_label | default('') }}"
          match_reason: "{{ _iter_repos[0].match_reason | default('') }}"
          blast_radius: "{{ blast_radius | default({'mode': 'multi_app_policy_demo', 'count': 1}) }}"
          draft_mr: true
          # Drives the Acme Inc. Risk Class row and whether the MR body
          # demands human review. Set in gitlab.appSeeds[].policy.
          risk_class: "{{ (_app_policy | default({})).get('riskClass', 'MEDIUM') }}"
          risk_rationale: "{{ (_app_policy | default({})).get('riskRationale', '') }}"
      when: (_iter_repos | length) >= 1

    - name: Run impact-analyzer and collect AO artifacts
      when: (_iter_repos | length) >= 1
      block:
        - name: Start OpenCode impact-analyzer (async)
          ansible.builtin.import_tasks: tasks/opencode-prompt-async.yml

        # Docs: GET /session/status — idle sessions are omitted from the map.
        - name: Wait for OpenCode session to go idle
          ansible.builtin.import_tasks: tasks/opencode-wait-idle.yml
          when: (opencode_session_id | default('') | length) > 0

        - name: Mark Impact failed when session never went idle
          ansible.builtin.set_fact:
            impact_failed: true
            impact_fail_reason: >-
              OpenCode session {{ opencode_session_id | default('n/a') }}
              did not become idle (status={{ opencode_sync_status | default('unknown') }},
              saw_busy={{ opencode_saw_busy | default(false) }}).
              Headless Impact must not hang on question/task prompts (ADR-063).
            iteration_outcome: failed
            remediation_needed: false
            draft_mr: false
            merge_request_iid: 0
          when:
            - (opencode_session_id | default('') | length) > 0
            - not (opencode_sync_ok | default(false) | bool)

        - name: Capture OpenCode session summary + UI deep link
          ansible.builtin.import_tasks: tasks/opencode-session-summary.yml
          when:
            - (opencode_session_id | default('') | length) > 0
            - not (impact_failed | default(false) | bool)

        - name: Detect already-current vs needs MR
          ansible.builtin.import_tasks: tasks/detect-impact-outcome.yml
          when:
            - (opencode_session_id | default('') | length) > 0
            - not (impact_failed | default(false) | bool)

        # Prefer detect-impact-outcome (assistant text only). Do NOT search
        # _impact_messages.content / skill JSON here — that false-positived on
        # f6rc7 after a real MR (!3) and skipped the scoped poll.
        - name: Widen already-current when assistant summary reports no MR
          ansible.builtin.set_fact:
            impact_already_current: true
            iteration_outcome: already_current
          when:
            - not (impact_failed | default(false) | bool)
            - not (impact_already_current | default(false) | bool)
            - >-
              (
                (_impact_assistant_text | default(''))
                ~ ' '
                ~ (opencode_session_summary | default(''))
              )
              | lower
              is search(
                'not found in pom|dependency [a-z0-9.:_-]+ not found|no merge request will be created|no merge request was created'
              )

        - name: Poll GitLab until draft remediation MR exists
          ansible.builtin.import_tasks: tasks/poll-gitlab-mr.yml
          when:
            - not (impact_failed | default(false) | bool)
            - not (impact_already_current | default(false) | bool)

        - name: Mark iteration as MR opened
          ansible.builtin.set_fact:
            iteration_outcome: mr_opened
            remediation_needed: true
            draft_mr: true
          when:
            - not (impact_failed | default(false) | bool)
            - not (impact_already_current | default(false) | bool)
            - mr_poll_found | default(false) | bool

        - name: Mark Impact failed when no MR appeared
          ansible.builtin.set_fact:
            impact_failed: true
            impact_fail_reason: >-
              Impact agent finished without opening MR
              {{ mr_expected_source_branch | default('update-artifact-*') }}
              on {{ opencode_gitlab_path | default('') }}.
              Session={{ opencode_session_id | default('n/a') }}.
            iteration_outcome: failed
            remediation_needed: false
            draft_mr: false
            merge_request_iid: 0
          when:
            - not (impact_failed | default(false) | bool)
            - not (impact_already_current | default(false) | bool)
            - not (mr_poll_found | default(false) | bool)

        - name: Defaults when already current (no MR)
          ansible.builtin.set_fact:
            iteration_outcome: already_current
            remediation_needed: false
            draft_mr: false
            merge_request_iid: 0
            source_branch: ""
            target_branch: "{{ gitlab_default_branch | default('main') }}"
            merge_request_url: ""
            repository_git_url: "{{ opencode_repo_url | default(repository_git_url | default('')) }}"
          when:
            - not (impact_failed | default(false) | bool)
            - impact_already_current | default(false) | bool

        - name: Resolve GitLab project id when already current
          ansible.builtin.uri:
            url: "{{ gitlab_url | regex_replace('/$', '') }}/api/v4/projects/{{ opencode_gitlab_path | regex_replace('/', '%2F') }}"
            method: GET
            headers:
              PRIVATE-TOKEN: "{{ gitlab_token | default(gitlab_pat | default('')) }}"
            status_code: [200]
            validate_certs: "{{ validate_certs | default(false) }}"
          register: _already_project
          no_log: true
          when:
            - not (impact_failed | default(false) | bool)
            - impact_already_current | default(false) | bool

        - name: Set project id for already-current path
          ansible.builtin.set_fact:
            project_id: "{{ _already_project.json.id | int }}"
          when:
            - not (impact_failed | default(false) | bool)
            - impact_already_current | default(false) | bool
            - _already_project is defined
            - (_already_project.status | default(0) | int) == 200

      rescue:
        - name: Capture unexpected Impact failure
          ansible.builtin.set_fact:
            impact_failed: true
            impact_fail_reason: >-
              Impact playbook error:
              {{ ansible_failed_result.msg | default(ansible_failed_result | to_json) }}
            iteration_outcome: failed
            remediation_needed: false
            draft_mr: false
            merge_request_iid: "{{ merge_request_iid | default(0) | int }}"

      always:
        # AAP omits empty-string set_stats keys; AO then fails property lookup
        # on ${impact.artifacts.*}. Always export non-empty / typed values
        # BEFORE any final fail (ADR-062 / ADR-063).
        - name: Export impact artifacts for AO loop
          ansible.builtin.set_stats:
            data:
              gitlab_path: "{{ opencode_gitlab_path | default('n/a', true) }}"
              approval: "{{ app_approval | default('needs_approval') }}"
              opencode_session_id: "{{ opencode_session_id | default('n/a', true) }}"
              opencode_session_title: "{{ opencode_session_title | default('n/a', true) }}"
              opencode_session_summary: "{{ opencode_session_summary | default('n/a', true) }}"
              opencode_session_ui_url: "{{ opencode_session_ui_url | default('n/a', true) }}"
              opencode_ui_url: "{{ opencode_ui_url | default('n/a', true) }}"
              draft_mr: "{{ draft_mr | default(false) }}"
              remediation_needed: "{{ remediation_needed | default(false) }}"
              iteration_outcome: "{{ iteration_outcome | default('failed') }}"
              snow_incident: "{{ snow_incident | default('n/a', true) }}"
              package_info: "{{ package_info | default({}) }}"
              merge_request_iid: "{{ merge_request_iid | default(0) | int }}"
              project_id: "{{ project_id | default(0) | int }}"
              source_branch: "{{ source_branch | default('n/a', true) }}"
              target_branch: "{{ target_branch | default('main') }}"
              repository_git_url: "{{ repository_git_url | default(opencode_repo_url | default('n/a', true)) }}"
              merge_request_url: "{{ merge_request_url | default('n/a', true) }}"
              impact_fail_reason: "{{ impact_fail_reason | default('n/a', true) }}"
            per_host: false

    - name: Export skip artifacts when no target app
      ansible.builtin.set_stats:
        data:
          gitlab_path: "n/a"
          approval: "n/a"
          opencode_session_id: "n/a"
          opencode_session_title: "n/a"
          opencode_session_summary: "n/a"
          opencode_session_ui_url: "n/a"
          opencode_ui_url: "{{ opencode_ui_url | default('n/a', true) }}"
          draft_mr: false
          remediation_needed: false
          iteration_outcome: skipped_no_target
          snow_incident: "{{ snow_incident | default('n/a', true) }}"
          package_info: "{{ package_info | default({}) }}"
          merge_request_iid: 0
          project_id: 0
          source_branch: "n/a"
          target_branch: "{{ gitlab_default_branch | default('main') }}"
          repository_git_url: "n/a"
          merge_request_url: "n/a"
          impact_fail_reason: "n/a"
        per_host: false
      when: (_iter_repos | length) < 1

    # Do NOT ansible.fail here. AO with continue_on_failure still receives
    # empty artifacts from a failed AAP job (f6rc7: impact_already crashed on
    # missing iteration_outcome). Export iteration_outcome=failed via set_stats
    # and let the Start canvas soft-skip Verifier (ADR-063).
    - name: Report Impact failure outcome for AO soft-skip
      ansible.builtin.debug:
        msg: >-
          IMPACT_FAILED outcome={{ iteration_outcome }}
          reason={{ impact_fail_reason | default('n/a') }}
          session={{ opencode_session_id | default('n/a') }}
      when:
        - (_iter_repos | length) >= 1
        - impact_failed | default(false) | bool
