---
# Merge a verified GitLab MR after AO auto-approval or human Approval.
#
# Policy (approval already happened upstream in AO):
#   - state=merged  → success (idempotent)
#   - open + draft/WIP → undraft, then merge
#   - open + not draft → merge immediately (do NOT PUT draft=false — GitLab
#     17.4 returns 400 when the MR is already ready)
#   - otherwise → fail
#
# Before merging, waits for the pull-request pipeline to report green on the
# MR head (ADR-050). AO reaches this node ~33s after the MR opens, but
# build-pull-request — which fills the Automated Validation table — does not
# finish until ~110s, so without this the auto path merges with every row
# still Pending and nothing can stop a FAILED build being merged.
# Polling here rather than in a separate AO node keeps check and merge
# atomic: no window in between where the MR could change.
#
# Optional: wait_for_status_context ("build-pull-request"; "" disables),
#           wait_for_status_retries (60), wait_for_status_delay (10)
# The poll leaves the MR visibly open while it runs, which is the demo window
# merge_delay_seconds used to provide — that fixed pause is gone.
- name: Merge GitLab merge request
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Require MR coordinates and token
      ansible.builtin.assert:
        that:
          - (gitlab_url | default('') | length) > 0
          - (gitlab_token | default(gitlab_pat | default('')) | length) > 0
          - (merge_request_iid | default(0) | int) > 0
          - (project_id | default(0) | int) > 0 or (gitlab_path | default('') | length) > 0
        fail_msg: "gitlab_url, token, merge_request_iid, and project_id/gitlab_path required"

    - name: Resolve project id from extra_vars
      ansible.builtin.set_fact:
        _project_id: "{{ project_id }}"
      when: (project_id | default(0) | int) > 0

    - name: Lookup project id from path
      ansible.builtin.uri:
        url: "{{ gitlab_url | regex_replace('/$', '') }}/api/v4/projects/{{ gitlab_path | regex_replace('/', '%2F') }}"
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ gitlab_token | default(gitlab_pat) }}"
        status_code: [200]
        validate_certs: "{{ validate_certs | default(false) }}"
      register: _proj
      when: (project_id | default(0) | int) < 1
      no_log: true

    - name: Set project id from lookup
      ansible.builtin.set_fact:
        _project_id: "{{ _proj.json.id }}"
      when: (project_id | default(0) | int) < 1

    - name: Fetch MR state
      ansible.builtin.uri:
        url: "{{ gitlab_url | regex_replace('/$', '') }}/api/v4/projects/{{ _project_id }}/merge_requests/{{ merge_request_iid }}"
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ gitlab_token | default(gitlab_pat) }}"
        status_code: [200]
        validate_certs: "{{ validate_certs | default(false) }}"
      register: _mr

    - name: Wait for the pull-request check on the MR head
      ansible.builtin.uri:
        url: "{{ gitlab_url | regex_replace('/$', '') }}/api/v4/projects/{{ _project_id }}/repository/commits/{{ _mr.json.sha }}/statuses?per_page=50"
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ gitlab_token | default(gitlab_pat) }}"
        status_code: [200]
        validate_certs: "{{ validate_certs | default(false) }}"
      register: _pr_statuses
      until: >-
        (
          (_pr_statuses.json | default([]))
          | selectattr('name', 'defined')
          | selectattr('name', 'search', wait_for_status_context | default('build-pull-request'))
          | selectattr('status', 'defined')
          | selectattr('status', 'in', ['success', 'failed', 'canceled'])
          | list | length
        ) > 0
      retries: "{{ wait_for_status_retries | default(60) | int }}"
      delay: "{{ wait_for_status_delay | default(10) | int }}"
      no_log: true
      when:
        - (wait_for_status_context | default('build-pull-request') | length) > 0
        - (_mr.json.state | default('')) == 'opened'

    - name: Require the pull-request check to be green
      ansible.builtin.assert:
        that:
          - >-
            (
              (_pr_statuses.json | default([]))
              | selectattr('name', 'defined')
              | selectattr('name', 'search', wait_for_status_context | default('build-pull-request'))
              | selectattr('status', 'equalto', 'success')
              | list | length
            ) > 0
        fail_msg: >-
          Refusing to auto-merge !{{ merge_request_iid }}: the
          '{{ wait_for_status_context | default('build-pull-request') }}'
          check is not green. The MR is left open for human review.
      when:
        - (wait_for_status_context | default('build-pull-request') | length) > 0
        - (_mr.json.state | default('')) == 'opened'
        - _pr_statuses is defined and (_pr_statuses.json is defined)

    - name: Derive MR flags
      ansible.builtin.set_fact:
        _mr_state: "{{ _mr.json.state | default('') }}"
        _mr_is_draft: >-
          {{
            (_mr.json.draft | default(false) | bool)
            or (_mr.json.work_in_progress | default(false) | bool)
            or ((_mr.json.title | default('')) is match('(?i)^(Draft:|WIP:)\\s*'))
          }}
        _already_merged: "{{ (_mr.json.state | default('')) == 'merged' }}"

    - name: Show MR readiness
      ansible.builtin.debug:
        msg: >-
          MR !{{ merge_request_iid }} state={{ _mr_state }}
          draft={{ _mr_is_draft }}
          merge_status={{ _mr.json.detailed_merge_status | default(_mr.json.merge_status) }}
          action={{
            'noop(already merged)' if (_already_merged | bool)
            else ('undraft+merge' if (_mr_is_draft | bool) else 'merge (open, not draft)')
          }}

    - name: Fail when MR is not open and not merged
      ansible.builtin.fail:
        msg: "MR !{{ merge_request_iid }} is '{{ _mr_state }}' — expected opened or merged"
      when:
        - not (_already_merged | bool)
        - _mr_state != 'opened'

    - name: Undraft only when MR is still draft/WIP
      ansible.builtin.uri:
        url: "{{ gitlab_url | regex_replace('/$', '') }}/api/v4/projects/{{ _project_id }}/merge_requests/{{ merge_request_iid }}"
        method: PUT
        headers:
          PRIVATE-TOKEN: "{{ gitlab_token | default(gitlab_pat) }}"
          Content-Type: application/json
        body_format: json
        body:
          draft: false
          title: "{{ _mr.json.title | regex_replace('^(?i)(Draft:|WIP:)\\s*', '') }}"
        status_code: [200]
        validate_certs: "{{ validate_certs | default(false) }}"
      when:
        - not (_already_merged | bool)
        - _mr_is_draft | bool

    - name: Merge open MR (approval already granted in AO)
      ansible.builtin.uri:
        url: "{{ gitlab_url | regex_replace('/$', '') }}/api/v4/projects/{{ _project_id }}/merge_requests/{{ merge_request_iid }}/merge"
        method: PUT
        headers:
          PRIVATE-TOKEN: "{{ gitlab_token | default(gitlab_pat) }}"
          Content-Type: application/json
        body_format: json
        body:
          should_remove_source_branch: false
          merge_when_pipeline_succeeds: "{{ merge_when_pipeline_succeeds | default(false) }}"
        status_code: [200, 201]
        validate_certs: "{{ validate_certs | default(false) }}"
      register: mr_merge
      when: not (_already_merged | bool)

    - name: Export merge artifacts
      ansible.builtin.set_stats:
        data:
          merge_status: merged
          merge_request_iid: "{{ merge_request_iid | int }}"
          project_id: "{{ _project_id | int }}"
          gitlab_path: "{{ gitlab_path | default('') }}"
          merge_request_url: "{{ _mr.json.web_url | default('') }}"
          merge_commit_sha: >-
            {{
              (
                mr_merge.json.merge_commit_sha
                if (mr_merge is defined and (mr_merge is succeeded | default(false)))
                else ''
              )
              | default(_mr.json.merge_commit_sha | default(''), true)
            }}
          iteration_outcome: merged
        per_host: false
