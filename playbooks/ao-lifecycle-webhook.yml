---
# Bridge: EDA lifecycle event → Automation Orchestrator eda_trigger webhook.
# Used for GitLab MR merged, PipelineRun terminal, and Argo health — each
# starts a short AO execution (not Approval PATCH, not a second Nexus start).
- name: Fire AO lifecycle webhook
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Resolve lifecycle webhook path
      ansible.builtin.set_fact:
        # Prefer explicit lifecycle override; else same single path as Start (ADR-037).
        ao_webhook_path: >-
          {{
            ao_lifecycle_webhook_path
            | default(ao_start_webhook_path | default(ao_webhook_path | default(''), true), true)
          }}

    # Resolve merge SHA when EDA omitted it (GitLab merge event / AAP strips "").
    - name: Resolve merge_commit_sha from GitLab MR when missing
      ansible.builtin.uri:
        url: >-
          {{ gitlab_url | regex_replace('/$', '') }}/api/v4/projects/{{ project_id
          }}/merge_requests/{{ merge_request_iid }}
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ gitlab_token | default(gitlab_pat | default('')) }}"
        status_code: [200]
        validate_certs: "{{ validate_certs | default(false) }}"
      register: _lc_mr
      no_log: true
      when:
        - (merge_commit_sha | default('') | length) == 0
        - (merge_request_iid | default(0) | int) > 0
        - (project_id | default('') | string | length) > 0
        - (gitlab_url | default('') | length) > 0
        - (gitlab_token | default(gitlab_pat | default('')) | length) > 0

    - name: Apply resolved merge_commit_sha
      ansible.builtin.set_fact:
        merge_commit_sha: >-
          {{
            _lc_mr.json.merge_commit_sha
            | default(_lc_mr.json.squash_commit_sha | default('unknown', true), true)
          }}
      when:
        - (merge_commit_sha | default('') | length) == 0
        - _lc_mr is defined
        - (_lc_mr.status | default(0) | int) == 200

    - name: Build AO lifecycle payload
      ansible.builtin.set_fact:
        event_payload:
          type: "{{ lifecycle_type | default('lightwell_lifecycle') }}"
          source: "{{ signal_source | default('eda') }}"
          guid: "{{ guid | default('') }}"
          gitlab_path: "{{ gitlab_path | default('') }}"
          merge_request_iid: "{{ merge_request_iid | default('') }}"
          # Always send a string key — AO rejects missing ${trigger.merge_commit_sha}.
          merge_commit_sha: "{{ merge_commit_sha | default('unknown', true) }}"
          project_id: "{{ project_id | default('') }}"
          gitlab_url: "{{ gitlab_url | default('') }}"
          gitlab_token: "{{ gitlab_token | default('') }}"
          status: "{{ status | default('') }}"
          sync: "{{ sync | default('') }}"
          health: "{{ health | default('') }}"
          argo_app: "{{ argo_app | default('') }}"
          revision: "{{ revision | default('unknown', true) }}"
          approval: "{{ approval | default('') }}"
          child_incident: "{{ child_incident | default('') }}"
          parent_incident: "{{ parent_incident | default('') }}"
          snow_incident: "{{ snow_incident | default('') }}"
          snow_url: "{{ snow_url | default('') }}"
          snow_svc_url: "{{ snow_svc_url | default('') }}"
          signal_source: "{{ signal_source | default('eda') }}"

    - name: Trigger Automation Orchestrator lifecycle webhook
      ansible.builtin.import_tasks: tasks/trigger-ao-webhook.yml
