---
# Create a ServiceNow mock incident at AO start (before Query TPA).
- name: Create ServiceNow incident for remediation run
  hosts: localhost
  gather_facts: false
  vars:
    snow_base: "{{ snow_svc_url | default(snow_url | default(''), true) }}"

  tasks:
    - name: Require snow URL
      ansible.builtin.assert:
        that:
          - (snow_base | default('') | length) > 0
        fail_msg: "snow_url or snow_svc_url is required"

    - name: Build incident description
      ansible.builtin.set_fact:
        _pkg_coord: >-
          {{
            (
              (artifact_group | default('') | length) > 0
              and (artifact_name | default('') | length) > 0
            )
            | ternary(
                (artifact_group | default('')) ~ ':' ~ (artifact_name | default('')),
                (package_purl | default(artifact_name | default('unknown')))
              )
          }}
        _sev: "{{ severity | default('medium') }}"
        _cve: "{{ cve_id | default('unknown') }}"
        _vuln: "{{ vulnerable_version | default('n/a') }}"
        _fix: "{{ fix_version | default(artifact_version | default('n/a')) }}"

    - name: Format parent short + rich description
      ansible.builtin.set_fact:
        _snow_short: >-
          [{{ _cve }}] {{ _sev | upper }} — remediate {{ _pkg_coord }}
          ({{ _vuln }} → {{ _fix }})
        # snow-mock UI renders description as Markdown (ADR-044).
        _snow_desc: |
          ## Lightwell remediation — parent incident

          Automation Orchestrator started a multi-app remediation for a remediated Maven artifact.
          **Child incidents** are created after TPA blast-radius classify (one per AO-owned app).

          ### Advisory

          - **CVE:** `{{ _cve }}`
          - **Severity:** `{{ _sev }}`
          - **Package:** `{{ _pkg_coord }}`
          - **Vulnerable:** `{{ _vuln }}`
          - **Remediated:** `{{ _fix }}`

          ### Correlation

          - **Tenant guid:** `{{ guid | default('') }}`
          - **Channel:** Monitoring → Lightwell AO
          - **Next:** Query TPA → classify → child INCs → Impact / Verifier / merge

          **Support tip:** follow Activity on each **child** for MR, pipeline, Argo, and OpenCode links.


    - name: POST incident to snow-mock
      ansible.builtin.uri:
        url: "{{ snow_base | regex_replace('/$', '') }}/api/v1/incidents"
        method: POST
        body_format: json
        body:
          short_description: "{{ _snow_short | truncate(160, true, '') }}"
          description: "{{ _snow_desc }}"
          caller_id: "{{ snow_caller_id | default('lightwell.ao@example.com') }}"
          created_by: "{{ snow_created_by | default('Lightwell AO') }}"
          opened_by: "{{ snow_created_by | default('Lightwell AO') }}"
          assignment_group: "{{ snow_assignment_group | default('Application Support') }}"
          priority: "{{ snow_priority | default('2 - High') }}"
          impact: "{{ snow_impact | default('2 - Medium') }}"
          category: Software
          subcategory: Application
          channel: Monitoring
          state: New
          guid: "{{ guid | default('') }}"
        status_code: [201]
        validate_certs: "{{ validate_certs | default(false) }}"
      register: snow_create

    - name: Remember parent for later plays in the same job
      ansible.builtin.set_fact:
        parent_incident: "{{ snow_create.json.result.number }}"
        snow_incident: "{{ snow_create.json.result.number }}"

    - name: Export parent incident for AO
      ansible.builtin.set_stats:
        data:
          parent_incident: "{{ snow_create.json.result.number }}"
          # Alias kept so older canvas nodes still resolve snow_incident.
          snow_incident: "{{ snow_create.json.result.number }}"
          snow_incident_sys: "{{ snow_create.json.result }}"
        per_host: false
      # prepare-remediation.yml exports once — AAP concatenates repeated set_stats.
      when: not (sdlc_suppress_set_stats | default(false) | bool)

    - name: Show created parent incident
      ansible.builtin.debug:
        msg: "Created parent {{ snow_create.json.result.number }}"
