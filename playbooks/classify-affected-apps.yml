---
# Load .lightwell/policy.json for each affected repo; split AO vs Renovate.
# Builds classify comment body for snow-comment.yml.
- name: Classify affected apps by Lightwell policy
  hosts: localhost
  gather_facts: false

  tasks:
    # Candidates MUST come from Query TPA artifacts (affected_repos). Do not
    # invent the three Acme apps here — that discarded real TPA matches and
    # sent Impact at repos that do not contain the vulnerable GAV (no MR).
    - name: Normalize candidate repos from TPA affected_repos
      ansible.builtin.set_fact:
        _candidates: "{{ affected_repos | default([]) }}"

    - name: Show blast-radius input for AO/AAP logs
      ansible.builtin.debug:
        msg: >-
          classify candidates={{ _candidates | length }}
          (from query_tpa.affected_repos; blast_radius_mode={{ blast_radius_mode | default('') }};
          blast_radius={{ blast_radius | default({}) }})
          paths={{ _candidates | map(attribute='gitlab_path') | list }}

    - name: Fail when TPA returned no affected repos
      ansible.builtin.fail:
        msg: >-
          Query TPA returned empty affected_repos — nothing to classify.
          Fix TPA/SBOM matching rather than synthesizing apps in classify.
      when: (_candidates | length) < 1

    - name: Init classification lists
      ansible.builtin.set_fact:
        ao_apps: []
        renovate_skips: []
        policy_failures: []

    - name: Classify each TPA-affected candidate
      ansible.builtin.include_tasks: tasks/classify-one-app.yml
      loop: "{{ _candidates }}"
      loop_control:
        loop_var: candidate_repo

    - name: Build classify comment body
      ansible.builtin.set_fact:
        snow_comment_body: |
          Blast-radius classification (guid={{ guid | default('') }}; tpa_affected={{ _candidates | length }}):
          AO-eligible:
          {% for a in ao_apps %}
          - {{ a.gitlab_path }} — approval={{ a.approval }} ({{ a.match_reason | default('tpa') }})
          {% else %}
          - (none)
          {% endfor %}
          Renovate skips (not in AO loop):
          {% for r in renovate_skips %}
          - {{ r.gitlab_path }}
          {% else %}
          - (none)
          {% endfor %}
          Policy failures (fail-closed):
          {% for f in policy_failures %}
          - {{ f.gitlab_path }} — {{ f.error }}
          {% else %}
          - (none)
          {% endfor %}

    - name: Export classification artifacts
      ansible.builtin.set_stats:
        data:
          ao_apps: "{{ ao_apps }}"
          renovate_skips: "{{ renovate_skips }}"
          policy_failures: "{{ policy_failures }}"
          snow_comment_body: "{{ snow_comment_body }}"
          package_info: "{{ package_info | default({}) }}"
          snow_incident: "{{ snow_incident | default('') }}"
        per_host: false
      when: not (sdlc_suppress_set_stats | default(false) | bool)

    - name: Fail when no AO-eligible apps
      ansible.builtin.fail:
        msg: "No AO-eligible apps after policy classify (renovate_skips={{ renovate_skips | length }}, failures={{ policy_failures | length }})"
      when: (ao_apps | length) < 1
