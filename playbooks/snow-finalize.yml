---
# Parent rollup after AO for-each complete. Lists children; closes parent.
# Children are not closed as deploy-success here (CI/CD gates land in later tasks).
- name: Finalize ServiceNow parent incident after remediation run
  hosts: localhost
  gather_facts: false
  vars:
    snow_base: "{{ snow_svc_url | default(snow_url | default(''), true) }}"
    _snow_final_state: "{{ snow_final_state | default('Resolved') }}"

  tasks:
    - name: Resolve parent incident
      ansible.builtin.set_fact:
        _parent: "{{ parent_incident | default(snow_incident | default('')) }}"

    - name: Require parent incident
      ansible.builtin.assert:
        that:
          - (snow_base | default('') | length) > 0
          - (_parent | default('') | length) > 0
        fail_msg: "snow_base and parent_incident (or snow_incident) are required"

    - name: GET parent (includes child_incidents)
      ansible.builtin.uri:
        url: "{{ snow_base | regex_replace('/$', '') }}/api/v1/incidents/{{ _parent }}"
        method: GET
        status_code: [200]
        validate_certs: "{{ validate_certs | default(false) }}"
      register: snow_parent_get

    - name: Build parent rollup comment
      ansible.builtin.set_fact:
        _children: "{{ snow_parent_get.json.result.child_incidents | default([]) }}"
        _final_body: |
          {{ snow_comment_body | default('Lightwell AO multi-app remediation finished.') }}
          guid={{ guid | default('') }}
          parent={{ _parent }}
          children={{ (snow_parent_get.json.result.child_incidents | default([])) | join(', ') or '(none)' }}
          Per-app outcomes are on each child incident. Deploy-success close of children
          is gated separately when CI/CD Approval signals are wired.

    - name: Post parent rollup comment
      ansible.builtin.uri:
        url: "{{ snow_base | regex_replace('/$', '') }}/api/v1/incidents/{{ _parent }}/comments"
        method: POST
        body_format: json
        body:
          body: "{{ _final_body }}"
          created_by: "{{ snow_created_by | default('Lightwell AO') }}"
          type: additional_comments
        status_code: [201]
        validate_certs: "{{ validate_certs | default(false) }}"

    - name: PATCH parent state
      ansible.builtin.uri:
        url: "{{ snow_base | regex_replace('/$', '') }}/api/v1/incidents/{{ _parent }}"
        method: PATCH
        body_format: json
        body:
          state: "{{ _snow_final_state }}"
          resolution_code: "{{ snow_resolution_code | default('Solved (Permanently)') }}"
          resolution_notes: "{{ _final_body }}"
          resolved_by: "{{ snow_created_by | default('Lightwell AO') }}"
        status_code: [200]
        validate_certs: "{{ validate_certs | default(false) }}"
      when: (close_parent | default(true) | bool)

    - name: Export finalize artifacts
      ansible.builtin.set_stats:
        data:
          parent_incident: "{{ _parent }}"
          snow_incident: "{{ _parent }}"
          child_incidents: "{{ _children | default([]) }}"
          snow_final_state: "{{ _snow_final_state if (close_parent | default(true) | bool) else 'open' }}"
        per_host: false
