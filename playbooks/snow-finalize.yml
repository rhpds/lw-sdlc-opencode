---
# After Deploy Healthy: resolve the parent INC and its child INCs. The brief
# "Deploy finished" status + child link was already posted by
# snow-lifecycle-event (deployed). Do not dump Argo/Route details here —
# those stay on the child comments.
#
# Soft-skip when this gitlab_path has no child/parent (bridge Deploy fan-out
# for AO apps that were not in this remediation). Never fail the JT for that —
# otherwise AO Deploy shows completed_with_errors on every promote.
#
# Closing the parent also closes every child (explicit PATCH here; snow-mock
# cascades on parent → Resolved/Closed as a safety net for UI/API closes).
- name: Finalize ServiceNow parent incident after remediation run
  hosts: localhost
  gather_facts: false
  vars:
    snow_base: "{{ snow_svc_url | default(snow_url | default(''), true) }}"
    _snow_final_state: "{{ snow_final_state | default('Resolved') }}"
    _missing_parents:
      - ""
      - "unknown"
      - "n/a"
      - "none"
      - "null"

  tasks:
    - name: Resolve parent incident from vars
      ansible.builtin.set_fact:
        _parent: "{{ parent_incident | default(snow_incident | default(''), true) }}"

    # Deploy EDA signal has no parent — recover via child cmdb_ci = gitlab_path.
    - name: Look up child by gitlab_path when parent missing
      ansible.builtin.uri:
        url: >-
          {{ snow_base | regex_replace('/$', '') }}/api/v1/incidents?cmdb_ci={{
            gitlab_path | urlencode }}&guid={{ guid | default('') | urlencode }}&limit=5
        method: GET
        status_code: [200]
        validate_certs: "{{ validate_certs | default(false) }}"
      register: _fin_list
      when:
        - (_parent | default('') | lower) in _missing_parents
        - (gitlab_path | default('') | length) > 0
        - (snow_base | default('') | length) > 0

    - name: Take parent from matched child
      ansible.builtin.set_fact:
        _parent: >-
          {{
            (_fin_list.json.result | default([]))
            | map(attribute='parent_incident')
            | select('string')
            | reject('equalto', '')
            | reject('equalto', 'unknown')
            | list
            | first
            | default(_parent, true)
          }}
      when:
        - _fin_list is defined
        - _fin_list is succeeded
        - (_fin_list.json.result | default([]) | length) > 0

    - name: Decide if parent can be finalized
      ansible.builtin.set_fact:
        _has_parent: >-
          {{
            (_parent | default('') | length) > 0
            and ((_parent | default('') | lower) not in _missing_parents)
          }}

    - name: Soft-skip finalize when no parent for this path
      ansible.builtin.debug:
        msg: >-
          No parent INC for gitlab_path={{ gitlab_path | default('') }}
          (parent={{ _parent | default('') }}) — skipping finalize. Typical for
          Deploy fan-out to AO apps that were not part of this remediation.
      when: not (_has_parent | bool)

    - name: Export skip artifacts
      ansible.builtin.set_stats:
        data:
          parent_incident: "n/a"
          snow_incident: "n/a"
          finalize_skipped: "true"
          snow_final_state: "skipped"
          gitlab_path: "{{ gitlab_path | default('n/a', true) }}"
        per_host: false
      when: not (_has_parent | bool)

    - name: Require snow_base when finalizing
      ansible.builtin.assert:
        that:
          - (snow_base | default('') | length) > 0
        fail_msg: "snow_base is required to finalize parent={{ _parent }}"
      when: (_has_parent | bool)

    - name: GET parent (includes child_incidents)
      ansible.builtin.uri:
        url: "{{ snow_base | regex_replace('/$', '') }}/api/v1/incidents/{{ _parent }}"
        method: GET
        status_code: [200]
        validate_certs: "{{ validate_certs | default(false) }}"
      register: snow_parent_get
      when: (_has_parent | bool)

    - name: Collect child incidents to close
      ansible.builtin.set_fact:
        _child_incidents: "{{ snow_parent_get.json.result.child_incidents | default([]) }}"
      when: (_has_parent | bool)

    - name: PATCH each child to the same final state
      ansible.builtin.uri:
        url: "{{ snow_base | regex_replace('/$', '') }}/api/v1/incidents/{{ item }}"
        method: PATCH
        body_format: json
        body:
          state: "{{ _snow_final_state }}"
          resolution_code: "{{ snow_resolution_code | default('Solved (Permanently)') }}"
          resolution_notes: >-
            Closed with parent {{ _parent }} after Deploy Healthy for
            {{ gitlab_path | default('app') }} (guid={{ guid | default('') }}).
          resolved_by: "{{ snow_created_by | default('Lightwell AO') }}"
        status_code: [200]
        validate_certs: "{{ validate_certs | default(false) }}"
      loop: "{{ _child_incidents | default([]) }}"
      when:
        - (_has_parent | bool)
        - (close_parent | default(true) | bool)
        - (close_children | default(true) | bool)
        - (_child_incidents | default([]) | length) > 0

    - name: PATCH parent state
      ansible.builtin.uri:
        url: "{{ snow_base | regex_replace('/$', '') }}/api/v1/incidents/{{ _parent }}"
        method: PATCH
        body_format: json
        body:
          state: "{{ _snow_final_state }}"
          resolution_code: "{{ snow_resolution_code | default('Solved (Permanently)') }}"
          resolution_notes: >-
            Deploy Healthy for {{ gitlab_path | default('app') }}
            (guid={{ guid | default('') }}). Per-app detail is on child incident(s).
          resolved_by: "{{ snow_created_by | default('Lightwell AO') }}"
        status_code: [200]
        validate_certs: "{{ validate_certs | default(false) }}"
      when:
        - (_has_parent | bool)
        - (close_parent | default(true) | bool)

    - name: Export finalize artifacts
      ansible.builtin.set_stats:
        data:
          parent_incident: "{{ _parent }}"
          snow_incident: "{{ _parent }}"
          finalize_skipped: "false"
          child_incidents: "{{ _child_incidents | default([]) }}"
          snow_final_state: "{{ _snow_final_state if (close_parent | default(true) | bool) else 'open' }}"
        per_host: false
      when: (_has_parent | bool)
