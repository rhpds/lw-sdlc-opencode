---
# Start-canvas prep: parent SNOW → TPA → classify → parent comment → children.
# JT name: "SDLC Prepare Remediation". AO Start is then
#   eda_trigger → prepare → apps_loop (Impact / Verifier / merge-or-await).
#
# IMPORTANT: AAP merges multiple set_stats in one job by concatenating strings
# and extending lists. That doubled parent_incident (INC…INC…) and duplicated
# ao_apps (classify list + children list), breaking the for-each (missing
# child_incident on the first item). Imported plays suppress set_stats; this
# playbook exports artifacts exactly once at the end.
- name: Prepare bundle — suppress intermediate set_stats
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Flag imported plays to skip set_stats
      ansible.builtin.set_fact:
        sdlc_suppress_set_stats: true

- ansible.builtin.import_playbook: snow-create-incident.yml

- ansible.builtin.import_playbook: query-tpa.yml

# Parent was created before Query TPA (placeholder [CVE-]). Refresh the title
# now that cve_id / package_info are enriched.
- name: Refresh parent INC with resolved CVE
  hosts: localhost
  gather_facts: false
  vars:
    snow_base: "{{ snow_svc_url | default(snow_url | default(''), true) }}"
  tasks:
    - name: Require parent for CVE refresh
      ansible.builtin.assert:
        that:
          - (snow_base | default('') | length) > 0
          - (parent_incident | default(snow_incident | default('')) | length) > 0
        fail_msg: "parent_incident and snow_base required to refresh CVE on parent"

    - name: Build refreshed parent short description
      ansible.builtin.set_fact:
        _parent_num: "{{ parent_incident | default(snow_incident) }}"
        _pkg_coord: >-
          {{
            (
              (artifact_group | default('') | length) > 0
              and (artifact_name | default('') | length) > 0
            )
            | ternary(
                (artifact_group | default('')) ~ ':' ~ (artifact_name | default('')),
                (package_purl | default(artifact_name | default('n/a')))
              )
          }}
        _sev: "{{ severity | default('medium') }}"
        # cve_id is often an AAP extra_var ("unknown") and shadows set_fact —
        # prefer package_info / resolved_cve_id when they hold a real CVE-YYYY-*.
        _cve_matches: >-
          {{
            [
              package_info.cve_id | default(''),
              resolved_cve_id | default(''),
              cve_id | default('')
            ] | select('match', '^CVE-[0-9]') | list
          }}
        _vuln: "{{ vulnerable_version | default('n/a') }}"
        _fix: "{{ fix_version | default(artifact_version | default('n/a')) }}"

    - name: Pick resolved CVE for parent title
      ansible.builtin.set_fact:
        _cve: "{{ (_cve_matches | first) if (_cve_matches | length > 0) else 'CVE-' }}"

    - name: Format parent short description
      ansible.builtin.set_fact:
        _parent_short: >-
          [{{ _cve }}] {{ _sev | upper }} — remediate {{ _pkg_coord }}
          ({{ _vuln }} → {{ _fix }})

    - name: PATCH parent short_description with resolved CVE
      ansible.builtin.uri:
        url: "{{ snow_base | regex_replace('/$', '') }}/api/v1/incidents/{{ _parent_num }}"
        method: PATCH
        body_format: json
        body:
          short_description: "{{ _parent_short | truncate(160, true, '') }}"
        status_code: [200]
        validate_certs: "{{ validate_certs | default(false) }}"

- ansible.builtin.import_playbook: classify-affected-apps.yml

- name: Post classify summary on parent incident
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Ensure comment targets parent
      ansible.builtin.set_fact:
        snow_incident: "{{ parent_incident | default(snow_incident | default(''), true) }}"

- ansible.builtin.import_playbook: snow-comment.yml

- name: Ensure create-children sees parent
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Re-assert parent for children play
      ansible.builtin.set_fact:
        parent_incident: "{{ parent_incident | default(snow_incident | default(''), true) }}"
        snow_incident: "{{ parent_incident | default(snow_incident | default(''), true) }}"

- ansible.builtin.import_playbook: snow-create-children.yml

- name: Export Prepare Remediation artifacts once for AO
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require parent and enriched ao_apps
      ansible.builtin.assert:
        that:
          - (parent_incident | default('') | length) > 0
          - (ao_apps_with_children | default([]) | length) > 0
        fail_msg: >-
          Prepare export needs parent_incident and ao_apps_with_children
          (got parent={{ parent_incident | default('') }},
          children={{ ao_apps_with_children | default([]) | length }})

    - name: Single set_stats for AO Start for-each
      ansible.builtin.set_stats:
        data:
          parent_incident: "{{ parent_incident }}"
          snow_incident: "{{ parent_incident }}"
          ao_apps: "{{ ao_apps_with_children }}"
          package_info: "{{ package_info | default({}) }}"
          affected_repos: "{{ affected_repos | default([]) }}"
          blast_radius: "{{ blast_radius | default({}) }}"
          renovate_skips: "{{ renovate_skips | default([]) }}"
          policy_failures: "{{ policy_failures | default([]) }}"
          # Never re-export extra_var "unknown"; prefer TPA-resolved package_info.
          cve_id: "{{ _export_cve }}"
          cve_title: "{{ package_info.cve_title | default(cve_title | default(''), true) }}"
          cve_description: "{{ package_info.cve_description | default(cve_description | default(''), true) }}"
          cvss_score: "{{ package_info.cvss_score | default(cvss_score | default(''), true) }}"
        per_host: false
      vars:
        _export_cve_matches: >-
          {{
            [
              package_info.cve_id | default(''),
              resolved_cve_id | default(''),
              cve_id | default('')
            ] | select('match', '^CVE-[0-9]') | list
          }}
        _export_cve: "{{ (_export_cve_matches | first) if (_export_cve_matches | length > 0) else 'CVE-' }}"
