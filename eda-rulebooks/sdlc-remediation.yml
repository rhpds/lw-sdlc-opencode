---
# SDLC remediation — Event-Driven Ansible rulebook (Automation Orchestrator path)
#
# EDA is the sensor/bridge only (webhook-driven, no AO Approval PATCH):
#   Nexus *.rhlw-*           → JT "SDLC Start Orchestrator"     → AO Start workflow
#   GitLab MR merged         → JT "SDLC AO Lifecycle Webhook"   → AO Merged+Build
#   Argo Synced+Healthy/fail → JT "SDLC AO Lifecycle Webhook"   → AO Deploy workflow
#
# Merged canvas polls PaC build status (ADR-039); PipelineRun→AO Build retired.
# Lifecycle MUST NOT fire Start Orchestrator (ADR-025). Do NOT act on MR open.
# For pre-AO: sdlc-remediation-legacy.yml.

- name: SDLC OpenCode remediation
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    # --- Deploy lifecycle (Argo health) ---
    # Build is polled inside AO Merged (ADR-039); ignore pipelinerun_terminal.
    - name: Argo Healthy → AO deploy webhook
      condition: >
        event.payload.type is defined and
        event.payload.type == "argo_app_health" and
        event.payload.sync is defined and
        event.payload.sync == "Synced" and
        event.payload.health is defined and
        event.payload.health == "Healthy"
      action:
        run_job_template:
          name: "SDLC AO Lifecycle Webhook"
          organization: "{{ aap_organization_name }}"
          job_args:
            extra_vars:
              ao_lifecycle_webhook_path: "{{ ao_deploy_webhook_path }}"
              lifecycle_type: lightwell_deploy
              signal_source: argo_healthy
              sync: Synced
              health: Healthy
              guid: "{{ event.payload.guid | default(guid) }}"
              gitlab_path: "{{ event.payload.gitlab_path | default('') }}"
              snow_url: "{{ snow_url | default('') }}"
              snow_svc_url: "{{ snow_svc_url | default('') }}"
              ao_base_url: "{{ ao_base_url }}"
              ao_client_id: "{{ ao_client_id }}"
              ao_client_secret: "{{ ao_client_secret }}"
              validate_certs: "{{ validate_certs | default(false) }}"

    - name: Argo deploy failure → AO deploy webhook
      condition: >
        event.payload.type is defined and
        event.payload.type == "argo_app_health" and
        event.payload.health is defined and
        (event.payload.health == "Degraded" or
         event.payload.health == "Missing")
      action:
        run_job_template:
          name: "SDLC AO Lifecycle Webhook"
          organization: "{{ aap_organization_name }}"
          job_args:
            extra_vars:
              ao_lifecycle_webhook_path: "{{ ao_deploy_webhook_path }}"
              lifecycle_type: lightwell_deploy
              signal_source: argo_failed
              sync: "{{ event.payload.sync | default('') }}"
              health: "{{ event.payload.health }}"
              guid: "{{ event.payload.guid | default(guid) }}"
              gitlab_path: "{{ event.payload.gitlab_path | default('') }}"
              snow_url: "{{ snow_url | default('') }}"
              snow_svc_url: "{{ snow_svc_url | default('') }}"
              ao_base_url: "{{ ao_base_url }}"
              ao_client_id: "{{ ao_client_id }}"
              ao_client_secret: "{{ ao_client_secret }}"
              validate_certs: "{{ validate_certs | default(false) }}"

    # --- Student merge in GitLab (never MR open — ADR-025) ---
    - name: GitLab MR merged → AO merged webhook
      condition: >
        event.payload.object_kind is defined and
        event.payload.object_kind == "merge_request" and
        event.payload.object_attributes is defined and
        event.payload.object_attributes.action is defined and
        event.payload.object_attributes.action == "merge"
      action:
        run_job_template:
          name: "SDLC AO Lifecycle Webhook"
          organization: "{{ aap_organization_name }}"
          job_args:
            extra_vars:
              ao_lifecycle_webhook_path: "{{ ao_merged_webhook_path }}"
              lifecycle_type: lightwell_mr_merged
              signal_source: gitlab_mr_merged
              guid: "{{ guid | default('') }}"
              gitlab_path: "{{ event.payload.project.path_with_namespace | default('') }}"
              merge_request_iid: "{{ event.payload.object_attributes.iid | default('') }}"
              merge_commit_sha: "{{ event.payload.object_attributes.merge_commit_sha | default('') }}"
              project_id: "{{ event.payload.project.id | default('') }}"
              gitlab_url: "{{ gitlab_url | default('') }}"
              gitlab_token: "{{ gitlab_token | default('') }}"
              snow_url: "{{ snow_url | default('') }}"
              snow_svc_url: "{{ snow_svc_url | default('') }}"
              ao_base_url: "{{ ao_base_url }}"
              ao_client_id: "{{ ao_client_id }}"
              ao_client_secret: "{{ ao_client_secret }}"
              validate_certs: "{{ validate_certs | default(false) }}"

    # Only Lightwell remediated artifacts (.rhlw-NNNNN).
    - name: Nexus component created or vulnerability fix published
      condition: >
        (event.payload.action is defined and event.payload.action == "CREATED" and
         event.payload.component.version is defined and
         event.payload.component.version is search("rhlw-")) or
        (event.payload.type is defined and event.payload.type == "vulnerability_fix_published")
      action:
        run_job_template:
          name: "SDLC Start Orchestrator"
          organization: "{{ aap_organization_name }}"
          job_args:
            extra_vars:
              artifact_name: "{{ (event.payload.component | default({})).name | default(event.payload.artifact_name | default('')) }}"
              artifact_group: "{{ (event.payload.component | default({})).group | default(event.payload.artifact_group | default('')) }}"
              artifact_version: "{{ (event.payload.component | default({})).version | default(event.payload.artifact_version | default('')) }}"
              package_purl: "{{ event.payload.package | default('') }}"
              vulnerable_version: "{{ event.payload.vulnerable_version | default('') }}"
              fix_version: "{{ event.payload.fix_version | default((event.payload.component | default({})).version | default('')) }}"
              cve_id: "{{ event.payload.cve_id | default('unknown') }}"
              severity: "{{ event.payload.severity | default('medium') }}"
              tpa_url: "{{ tpa_url }}"
              keycloak_url: "{{ keycloak_url }}"
              keycloak_tpa_realm: "{{ keycloak_tpa_realm }}"
              tpa_uploader_username: "{{ tpa_uploader_username }}"
              tpa_oauth_client_id: "{{ tpa_oauth_client_id }}"
              tpa_uploader_password: "{{ tpa_uploader_password }}"
              tpa_sbom_label: "{{ tpa_sbom_label }}"
              gitlab_url: "{{ gitlab_url }}"
              remediation_app_gitlab_path: "{{ remediation_app_gitlab_path }}"
              eda_webhook_url: "{{ eda_webhook_url }}"
              opencode_base_url: "{{ opencode_base_url }}"
              opencode_server_username: "{{ opencode_server_username | default('opencode') }}"
              opencode_server_password: "{{ opencode_server_password }}"
              snow_url: "{{ snow_url | default('') }}"
              snow_svc_url: "{{ snow_svc_url | default('') }}"
              gitlab_token: "{{ gitlab_token | default('') }}"
              tpa_oauth_client_secret: "{{ tpa_oauth_client_secret | default('') }}"
              blast_radius_mode: "{{ blast_radius_mode | default('tpa_affected_repos') }}"
              aap_organization_name: "{{ aap_organization_name }}"
              ao_base_url: "{{ ao_base_url }}"
              ao_client_id: "{{ ao_client_id }}"
              ao_client_secret: "{{ ao_client_secret }}"
              ao_start_webhook_path: "{{ ao_start_webhook_path }}"
              guid: "{{ guid | default('') }}"

    - name: Log unmatched webhook events
      condition: true
      action:
        debug:
          msg: "Unmatched SDLC webhook event (no rule action taken): {{ event.payload | default({}) }}"
